name: vhite
description: Scan front-end code for AI-generated problems and upload the results to GitHub Code Scanning
inputs:
  path:
    description: Folder to scan
    required: false
    default: "."
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
    - id: scan
      shell: bash
      continue-on-error: true
      run: npx --yes @vhite/vhite "${{ inputs.path }}" --format sarif > vhite.sarif
    - uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: vhite.sarif
    - if: steps.scan.outcome == 'failure'
      shell: bash
      run: |
        echo "vhite found errors or warnings. See the Code Scanning results."
        exit 1